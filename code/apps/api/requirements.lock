# Python 依赖锁文件 —— 生产镜像的唯一依赖真源（可复现构建）
#
# 为什么需要：pyproject.toml 里只有区间（>=x,<y），pip 每次构建都会解析到当时的最新版本，
# 于是同一个 commit 在不同时间能构建出不同的镜像。本文件把**含全部传递依赖**的
# 精确版本冻结下来，Dockerfile 只按本文件安装。
#
# 重新生成（改完 pyproject.toml 后执行，Windows PowerShell）：
#   docker run --rm -v "${PWD}:/w" -w /w/apps/api python:3.12-slim `
#     sh -c "pip install --no-cache-dir -q -i https://pypi.tuna.tsinghua.edu.cn/simple . && pip freeze" `
#     | Select-String -NotMatch '^knowledge-agent-api' > requirements.lock
#
# 说明：
#   · 不含项目自身（knowledge-agent-api）—— Dockerfile 用 pip install --no-deps . 单独安装
#   · 不含 dev 可选依赖（pytest 等）—— 它们不参与生产镜像

