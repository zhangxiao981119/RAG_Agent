# 生产环境部署编排（M5 任务 6 · 手册附录 B 环境变量清单）
#
# 与开发用 docker-compose.yml 的差异：
#   1. APP_ENV=prod；api 启动只跑 alembic + seed_prod（不建测试用户/评估用例）
#   2. 关键密钥无弱默认值，MUST 在 .env 中提供（${VAR:?提示} 缺失即报错，拒绝启动）
#   3. 唯一对外暴露的是 gateway（Caddy）的 80/443（TLS 终止 + 自签证书）；
#      web/api/postgres/redis/minio/模型服务 均只在容器内网通信，不绑定宿主端口
#   4. 全部服务 restart: unless-stopped + 日志轮转
#
# 使用：cp .env.prod.example .env 并改密后
#   docker compose -p kagent -f docker-compose.prod.yml up -d --build
#
# 基础镜像一律锁 digest（可复现构建）：tag 可能被重推指向新镜像，digest 不会。
# digest 与 registry 绑定 —— 换镜像站/私有仓库时需重新解析后替换：
#   docker image inspect --format '{{.RepoDigests}}' <ref>

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?必须在 .env 设置}
      POSTGRES_USER: ${POSTGRES_USER:?必须在 .env 设置}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须在 .env 设置}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?必须在 .env 设置}
    environment:
      # 供容器内 healthcheck 脚本读取（redis 镜像本身不使用该变量，密码以 command 的 requirepass 为准）
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?必须在 .env 设置}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?必须在 .env 设置}
    volumes:
      - minio_data:/data
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 本地嵌入服务（OpenAI 兼容 /v1/embeddings）。如使用外部端点，删除本服务并改 EMBEDDING_BASE_URL
  embedding:
    image: ${EMBEDDING_IMAGE:-docker.m.daocloud.io/michaelf34/infinity:latest-cpu@sha256:161ef2dd48ba050ad29a413d671270502acb4ad67759d695eb0d325c033a935d}
    restart: unless-stopped
    command: v2 --model-id ${EMBEDDING_MODEL_ID:-BAAI/bge-m3} --engine torch --url-prefix /v1 --port 8000 --served-model-name ${EMBEDDING_MODEL:-bge-m3}
    environment:
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    volumes:
      - hf_cache:/app/.cache/huggingface
    # 稳态约 1.4GB，启动峰值超 3GB（与另一模型服务同时加载）；给 3g 会在加载期 OOM(137)。
    # 与 docker-compose.yml（dev）保持一致，prod 原值 3g 为漏改。
    mem_limit: 4g
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      # ★ 模型服务冷启动实测约 9 分钟（CPU 机器 + 与另一模型服务同时加载，含 infinity 启动基准测试）；
      #   首次部署还要从 HF_ENDPOINT 下载约 5GB 权重（本文件按 30 分钟估）。
      #   原窗口 start_period 3m + 30×10s = 8min 不够，会在启动过程中被判 unhealthy 并让 /api/health 误报依赖故障。
      #   现为 start_period 10m + 60×30s ≈ 40min；探针频率从 10s 放宽到 30s ——
      #   加载期容器已跑满 CPU，每 10s 起一个 python 解释器既抢 CPU 又容易误报。
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 10m

  # 本地重排服务（OpenAI 兼容 /v1/rerank）
  reranker:
    image: ${RERANKER_IMAGE:-docker.m.daocloud.io/michaelf34/infinity:latest-cpu@sha256:161ef2dd48ba050ad29a413d671270502acb4ad67759d695eb0d325c033a935d}
    restart: unless-stopped
    command: v2 --model-id ${RERANKER_MODEL_ID:-BAAI/bge-reranker-v2-m3} --engine torch --url-prefix /v1 --port 8000 --served-model-name ${RERANK_MODEL:-bge-reranker-v2-m3}
    environment:
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    volumes:
      - hf_cache:/app/.cache/huggingface
    # 稳态约 2.4GB（CLI warmup 与 server engine 双份驻留），启动峰值超 3GB；给 3g 会在加载期 OOM(137)
    mem_limit: 4g
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      # ★ 模型服务冷启动实测约 9 分钟（CPU 机器 + 与另一模型服务同时加载，含 infinity 启动基准测试）；
      #   首次部署还要从 HF_ENDPOINT 下载约 5GB 权重（本文件按 30 分钟估）。
      #   原窗口 start_period 3m + 30×10s = 8min 不够，会在启动过程中被判 unhealthy 并让 /api/health 误报依赖故障。
      #   现为 start_period 10m + 60×30s ≈ 40min；探针频率从 10s 放宽到 30s ——
      #   加载期容器已跑满 CPU，每 10s 起一个 python 解释器既抢 CPU 又容易误报。
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 10m

  # 数据库迁移（一次性）：先于 api/worker 完成，失败则下游不启动（fail-fast）
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: alembic upgrade head
    restart: "no"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # 生产启动：生产种子（仅租户/管理员/公开库）+ API；迁移由 migrate 服务先完成
    # ★ 固定单 worker（--workers 1）：指标在进程内聚合，多 worker 时 Prometheus 从
    #   同一端口只会抓到随机一个副本，rate() 随副本切换跳变。单 worker 下 asyncio
    #   足以承载 I/O 密集的检索/流式生成；进程崩溃由 restart 策略兜底。
    command: >
      sh -c "python -m scripts.seed_prod &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"
    environment:
      APP_ENV: prod
      JWT_SECRET: ${JWT_SECRET:?必须在 .env 设置（建议 openssl rand -hex 32）}
      TENANT_CODE: ${TENANT_CODE:-default}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?必须在 .env 设置（首次登录后请修改）}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-kagent-docs}
      LLM_BASE_URL: ${LLM_BASE_URL:?必须在 .env 设置}
      LLM_API_KEY: ${LLM_API_KEY:?必须在 .env 设置}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://embedding:8000/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-http://reranker:8000/v1}
      RERANK_MODEL: ${RERANKER_MODEL:-bge-reranker-v2-m3}
      # 重排开关：默认 false。本机 CPU 下重排远超 3s 超时，开启也必降级且白等；
      # false 时检索层不发起调用、健康检查与启动均不探活，直接走 vector 口径。
      # 换到 GPU / 更强算力后置 true 启用（启用前 MUST 重标 RELEVANCE_THRESHOLD_RERANK）。
      RERANK_ENABLED: ${RERANK_ENABLED:-false}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      # ★ 白名单与 dev 段保持一致（含图片）。本 compose 未起 ocr 服务时
      #   OCR_ENABLED 必须保持 false —— 此时图片上传会被 kbs.py 拦成 415 并提示
      #   需要开 OCR，而不是落进解析层才失败。要真正支持扫描件/图片，
      #   MUST 先把 apps/ocr 作为一个服务加进来并把 OCR_ENABLED 置 true。
      ALLOWED_EXT: ${ALLOWED_EXT:-pdf,md,txt,xls,xlsx,docx,png,jpg,jpeg,gif,webp,bmp}
      OCR_ENABLED: ${OCR_ENABLED:-false}
      OCR_BASE_URL: ${OCR_BASE_URL:-http://ocr:8000}
      IMAGE_QUALITY_GATE_ENABLED: ${IMAGE_QUALITY_GATE_ENABLED:-true}
      IMAGE_ENHANCE_ENABLED: ${IMAGE_ENHANCE_ENABLED:-true}
      # DB 连接池：口径见 settings.db_pool_size 的压测注释（每在途请求 1~2 条连接）
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      MULTI_TENANT: ${MULTI_TENANT:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      embedding:
        condition: service_started
      reranker:
        condition: service_started
    volumes:
      - ./sync_data:/data/sync
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s

  # arq 异步解析 worker
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: arq app.workers.parse_job.WorkerSettings
    environment:
      APP_ENV: prod
      JWT_SECRET: ${JWT_SECRET:?必须在 .env 设置}
      TENANT_CODE: ${TENANT_CODE:-default}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-kagent-docs}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://embedding:8000/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      ALLOWED_EXT: ${ALLOWED_EXT:-pdf,md,txt,xls,xlsx,docx,png,jpg,jpeg,gif,webp,bmp}
      OCR_ENABLED: ${OCR_ENABLED:-false}
      OCR_BASE_URL: ${OCR_BASE_URL:-http://ocr:8000}
      IMAGE_QUALITY_GATE_ENABLED: ${IMAGE_QUALITY_GATE_ENABLED:-true}
      IMAGE_ENHANCE_ENABLED: ${IMAGE_ENHANCE_ENABLED:-true}
      # worker 与 api 共用 settings，池不压小会吃掉 api 的连接余量（解析由 1 路上限串行化）
      DB_POOL_SIZE: ${WORKER_DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${WORKER_DB_MAX_OVERFLOW:-5}
    volumes:
      - ./sync_data:/data/sync
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      embedding:
        condition: service_started
    logging: *default-logging
    healthcheck:
      test: ["CMD", "pgrep", "-f", "arq app.workers.parse_job"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build: ./apps/web
    restart: unless-stopped
    # 仅内网暴露：由 gateway 反代访问，宿主机不绑端口，杜绝绕过 TLS 明文直连
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 20

  # TLS 入口（唯一对外暴露）—— Caddy 内置 CA 自签，反代到 web
  gateway:
    image: ${CADDY_IMAGE:-docker.m.daocloud.io/library/caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f}
    restart: unless-stopped
    environment:
      # 内网 IP 或内部主机名（如 192.168.1.100 / rag.corp.local），供 Caddyfile 的站点块使用
      SITE_ADDRESS: ${SITE_ADDRESS:?必须在 .env 设置（内网 IP 或内部主机名）}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      # ★ caddy_data 持久化内置 CA 与证书 —— 卷丢失会重新生成 CA，客户端需重新导入根证书
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    logging: *default-logging
    healthcheck:
      # 探 Caddy 本地管理接口（默认 127.0.0.1:2019），验证进程存活；不触达 TLS 链路
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ── 可观测性（P0-4）────────────────────────────────────
  # 抓取 api:8000/metrics（Prometheus 文本格式），驱动 Grafana 看板与告警。
  # 两者均不发布宿主端口：Grafana 经 gateway(Caddy) 的 /grafana 子路径访问，
  # Prometheus 仅内网（如需直连排障，用 docker compose exec/port-forward）。
  prometheus:
    image: docker.m.daocloud.io/prom/prometheus:v3.13.4@sha256:87861b8cf91579109319ebc300f3f1060e6da9c05d6ae8ad15a20c879e84e32e
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 指标留存 30 天，超出自动清理（单机磁盘保护）
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      # 只等 api 起来，不强绑 healthy —— 抓取失败会自动重试，无需把启动顺序绑死
      api:
        condition: service_started
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  grafana:
    image: docker.m.daocloud.io/grafana/grafana:11.6.0@sha256:62d2b9d20a19714ebfe48d1bb405086081bc602aa053e28cf6d73c7537640dfb
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?必须在 .env 设置}
      # 经 gateway 的 /grafana 子路径访问：root_url 与子路径开关必须一致，否则静态资源 404
      GF_SERVER_ROOT_URL: https://${SITE_ADDRESS}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # 离线私有化：关闭版本检查与匿名使用统计上报
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      # 数据源 / 看板 / 告警规则均为文件化 provisioning，随镜像外的 ops 目录版本化
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  minio_data:
  hf_cache:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
