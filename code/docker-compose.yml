# 基础镜像一律锁 digest（可复现构建）：tag 可能被重推指向新镜像，digest 不会。
# digest 与 registry 绑定 —— 换镜像站/私有仓库时需重新解析后替换：
#   docker image inspect --format '{{.RepoDigests}}' <ref>
services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kagent}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-kagent}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  # M2 本地嵌入服务（OpenAI 兼容 /v1/embeddings）
  # 镜像可替换为其他 OpenAI 兼容服务；若用外部端点，注释掉本服务并改 EMBEDDING_BASE_URL
  embedding:
    # digest 取自 daocloud 镜像站的 cpu 变体；GPU 环境或私有仓库需用自有 registry 的 digest 覆盖
    image: ${EMBEDDING_IMAGE:-docker.m.daocloud.io/michaelf34/infinity:latest-cpu@sha256:161ef2dd48ba050ad29a413d671270502acb4ad67759d695eb0d325c033a935d}
    # model-id 是 HF 仓库 ID，served-model-name 是 API 模型名，二者不可混用
    # 用 torch 而非 optimum：ONNX 图优化序列化阶段双份模型峰值会撑爆 8GB 内存
    # url-prefix=/v1 对齐 api 的 OpenAI 兼容调用路径
    command: v2 --model-id ${EMBEDDING_MODEL_ID:-BAAI/bge-m3} --engine torch --url-prefix /v1 --port 8000 --served-model-name ${EMBEDDING_MODEL:-bge-m3}
    environment:
      # huggingface.co 不可达，模型权重走国内镜像站
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    volumes:
      # 镜像内 HF_HOME=/app/.cache/huggingface，挂载路径必须与之匹配
      - hf_cache:/app/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      # ★ 模型服务冷启动实测约 9 分钟（CPU 机器 + 与另一模型服务同时加载，含 infinity 启动基准测试）；
      #   首次部署还要从 HF_ENDPOINT 下载约 5GB 权重（init-prod.sh 按 30 分钟估）。
      #   原窗口 start_period 2m + 30×10s = 7min 不够，会在启动过程中被判 unhealthy 并让 /api/health 误报依赖故障。
      #   现为 start_period 10m + 60×30s ≈ 40min；探针频率从 10s 放宽到 30s ——
      #   加载期容器已跑满 CPU，每 10s 起一个 python 解释器既抢 CPU 又容易误报。
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 10m

  # M2 本地重排服务（OpenAI 兼容 /v1/rerank）
  reranker:
    image: ${RERANKER_IMAGE:-docker.m.daocloud.io/michaelf34/infinity:latest-cpu@sha256:161ef2dd48ba050ad29a413d671270502acb4ad67759d695eb0d325c033a935d}
    # bge-reranker-v2-m3 官方仓库无 ONNX 文件，optimum 引擎会报错，CPU 上用 torch
    # url-prefix=/v1 对齐 api 的 OpenAI 兼容调用路径
    command: v2 --model-id ${RERANKER_MODEL_ID:-BAAI/bge-reranker-v2-m3} --engine torch --url-prefix /v1 --port 8000 --served-model-name ${RERANKER_MODEL:-bge-reranker-v2-m3}
    environment:
      # huggingface.co 不可达，模型权重走国内镜像站
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    volumes:
      # 镜像内 HF_HOME=/app/.cache/huggingface，挂载路径必须与之匹配
      - hf_cache:/app/.cache/huggingface
    # 稳态约 2.4GB（CLI warmup 与 server engine 双份驻留），启动峰值超 3GB；给 3g 会在加载期 OOM(137)
    mem_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      # ★ 模型服务冷启动实测约 9 分钟（CPU 机器 + 与另一模型服务同时加载，含 infinity 启动基准测试）；
      #   首次部署还要从 HF_ENDPOINT 下载约 5GB 权重（init-prod.sh 按 30 分钟估）。
      #   原窗口 start_period 2m + 30×10s = 7min 不够，会在启动过程中被判 unhealthy 并让 /api/health 误报依赖故障。
      #   现为 start_period 10m + 60×30s ≈ 40min；探针频率从 10s 放宽到 30s ——
      #   加载期容器已跑满 CPU，每 10s 起一个 python 解释器既抢 CPU 又容易误报。
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 10m

  # B' 本地 OCR 服务（GOT-OCR2.0 CPU 推理）：扫描件 PDF / 图片入库转录，数据不出域
  ocr:
    build:
      context: .
      dockerfile: apps/ocr/Dockerfile
      args:
        # GitHub clone 官方推理代码须走代理；Clash 开启时构建：
        #   OCR_BUILD_PROXY=http://host.docker.internal:7897 docker compose build ocr
        HTTPS_PROXY: ${OCR_BUILD_PROXY:-}
        HTTP_PROXY: ${OCR_BUILD_PROXY:-}
    restart: unless-stopped
    environment:
      # huggingface.co 不可达，模型权重走国内镜像站
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      OCR_MODEL_ID: ${OCR_MODEL_ID:-stepfun-ai/GOT-OCR2_0}
    volumes:
      # 权重缓存与 embedding/reranker 共用 volume（GOT-OCR2_0 约 1.3GB，一次下载长期复用）
      - hf_cache:/app/.cache/huggingface
    # 权重 fp32 驻留约 2.3GB + 推理峰值；低于 3g 加载期会 OOM(137)，与 reranker 同档
    mem_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      # 模型 CPU 加载约 1~3 分钟，首次部署含权重下载；口径对齐 embedding/reranker
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 10m
    # ★ 不 ports：仅容器网络内可达，对外唯一入口是 Caddy 反代的 api/web

  # 数据库迁移（一次性）：先于 api/worker 完成，失败则下游不启动（fail-fast）
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: alembic upgrade head
    restart: "no"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@postgres:5432/${POSTGRES_DB:-kagent}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-dev}
      # ★ 必须显式注入：缺失时 auth._get_jwt_secret() 会按进程随机兜底，
      #   导致多副本/重启后 token 全部失效（静默故障，极难排查）
      JWT_SECRET: ${JWT_SECRET:-}
      TENANT_CODE: ${TENANT_CODE:-default}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@postgres:5432/${POSTGRES_DB:-kagent}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-kagent-docs}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://embedding:8000/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-http://reranker:8000/v1}
      RERANK_MODEL: ${RERANKER_MODEL:-bge-reranker-v2-m3}
      # B' 扫描件 OCR：与 worker 同源注入（api 自身不走 OCR，保持 settings 口径一致）
      OCR_ENABLED: ${OCR_ENABLED:-false}
      OCR_BASE_URL: ${OCR_BASE_URL:-http://ocr:8000}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      ALLOWED_EXT: ${ALLOWED_EXT:-pdf,md,txt,xls,xlsx,docx}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      MULTI_TENANT: ${MULTI_TENANT:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./sync_data:/data/sync
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      embedding:
        condition: service_started
      reranker:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  # arq 异步解析 worker（M2 §6 任务 2 / M6 任务 1 同步 cron）
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: arq app.workers.parse_job.WorkerSettings
    restart: unless-stopped
    healthcheck:
      # arq 无 HTTP 端口，用 pgrep 检查进程是否存活
      test: ["CMD", "pgrep", "-f", "arq app.workers.parse_job"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      APP_ENV: ${APP_ENV:-dev}
      TENANT_CODE: ${TENANT_CODE:-default}
      # M7 WU-M-15：治理审查任务在 worker 内调 LLM，必须与 api 段同源注入
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@postgres:5432/${POSTGRES_DB:-kagent}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-kagent-docs}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://embedding:8000/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      # B' 扫描件 OCR：解析任务在 worker 内调用本地 ocr 服务（fail-closed，未启用时不触达）
      OCR_ENABLED: ${OCR_ENABLED:-false}
      OCR_BASE_URL: ${OCR_BASE_URL:-http://ocr:8000}
      ALLOWED_EXT: ${ALLOWED_EXT:-pdf,md,txt,xls,xlsx,docx}
    volumes:
      - ./sync_data:/data/sync
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      embedding:
        condition: service_started
      ocr:
        condition: service_started

  web:
    build: ./apps/web
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 容器内 localhost 优先解析到 IPv6，而 nginx 仅监听 IPv4，必须用 127.0.0.1
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  redis_data:
  minio_data:
  hf_cache:
