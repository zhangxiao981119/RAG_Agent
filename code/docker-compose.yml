services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kagent}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-kagent}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  # M2 本地嵌入服务（OpenAI 兼容 /v1/embeddings）
  # 镜像可替换为其他 OpenAI 兼容服务；若用外部端点，注释掉本服务并改 EMBEDDING_BASE_URL
  embedding:
    image: ${EMBEDDING_IMAGE:-michaelf34/infinity:latest}
    # model-id 是 HF 仓库 ID，served-model-name 是 API 模型名，二者不可混用
    # 用 torch 而非 optimum：ONNX 图优化序列化阶段双份模型峰值会撑爆 8GB 内存
    # url-prefix=/v1 对齐 api 的 OpenAI 兼容调用路径
    command: v2 --model-id ${EMBEDDING_MODEL_ID:-BAAI/bge-m3} --engine torch --url-prefix /v1 --port 8000 --served-model-name ${EMBEDDING_MODEL:-bge-m3}
    environment:
      # huggingface.co 不可达，模型权重走国内镜像站
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    volumes:
      # 镜像内 HF_HOME=/app/.cache/huggingface，挂载路径必须与之匹配
      - hf_cache:/app/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  # M2 本地重排服务（OpenAI 兼容 /v1/rerank）
  reranker:
    image: ${RERANKER_IMAGE:-michaelf34/infinity:latest}
    # bge-reranker-v2-m3 官方仓库无 ONNX 文件，optimum 引擎会报错，CPU 上用 torch
    # url-prefix=/v1 对齐 api 的 OpenAI 兼容调用路径
    command: v2 --model-id ${RERANKER_MODEL_ID:-BAAI/bge-reranker-v2-m3} --engine torch --url-prefix /v1 --port 8000 --served-model-name ${RERANKER_MODEL:-bge-reranker-v2-m3}
    environment:
      # huggingface.co 不可达，模型权重走国内镜像站
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    volumes:
      # 镜像内 HF_HOME=/app/.cache/huggingface，挂载路径必须与之匹配
      - hf_cache:/app/.cache/huggingface
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-dev}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      TENANT_CODE: ${TENANT_CODE:-default}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@postgres:5432/${POSTGRES_DB:-kagent}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-kagent-docs}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://embedding:8000/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-http://reranker:8000/v1}
      RERANK_MODEL: ${RERANKER_MODEL:-bge-reranker-v2-m3}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      ALLOWED_EXT: ${ALLOWED_EXT:-pdf,md,txt,xls,xlsx}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      MULTI_TENANT: ${MULTI_TENANT:-false}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      embedding:
        condition: service_started
      reranker:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  # arq 异步解析 worker（M2 §6 任务 2）
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: arq app.workers.parse_job.WorkerSettings
    restart: unless-stopped
    healthcheck:
      # arq 无 HTTP 端口，用 pgrep 检查进程是否存活
      test: ["CMD", "pgrep", "-f", "arq app.workers.parse_job"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      APP_ENV: ${APP_ENV:-dev}
      TENANT_CODE: ${TENANT_CODE:-default}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@postgres:5432/${POSTGRES_DB:-kagent}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-kagent-docs}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://embedding:8000/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      ALLOWED_EXT: ${ALLOWED_EXT:-pdf,md,txt,xls,xlsx}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      embedding:
        condition: service_started

  web:
    build: ./apps/web
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 容器内 localhost 优先解析到 IPv6，而 nginx 仅监听 IPv4，必须用 127.0.0.1
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  redis_data:
  minio_data:
  hf_cache:
