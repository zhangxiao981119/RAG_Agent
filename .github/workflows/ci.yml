name: CI

# 触发：master 推送 + 所有 PR
on:
  push:
    branches: [master]
  pull_request:

# 同一分支的旧运行自动取消，避免堆积
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 后端：lint + 单元测试 ───────────────────────────────
  # 测试为自洽单元测试，不连数据库；但 test_health 走 TestClient 会触发
  # lifespan，其中 crypto.warm_up()（同步 Redis）与 arq 连接池都会真实建连，
  # 因此必须有 Redis 服务容器，否则该用例失败。
  backend:
    name: 后端 · ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/apps/api
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/apps/api/requirements.lock

      - name: 安装生产依赖（锁定）
        run: pip install -r requirements.lock

      - name: 安装测试工具（dev 依赖不参与生产锁，单独装）
        run: pip install "pytest>=8,<9" "pytest-asyncio>=0.24,<1" "ruff>=0.6,<1"

      - name: ruff 静态检查
        run: ruff check .

      - name: pytest
        run: pytest

  # ── 前端：类型检查 + 构建 ───────────────────────────────
  # npm run build = tsc -b && vite build，类型错误会直接使构建失败
  frontend:
    name: 前端 · 类型检查 + 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/apps/web
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: code/apps/web/package-lock.json

      - name: 安装依赖（锁定）
        run: npm ci

      - name: 类型检查 + 构建
        run: npm run build